[project]
name = "eval-api"
version = "0.1.0"
description = "Bench-runner como servicio: evalúa prompts vía HTTP sobre web-api-base."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
eval-api = "eval_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_api"]

[dependency-groups]
dev = ["pytest>=8,<9"]